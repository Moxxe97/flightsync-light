[package]
name = "app"
version = "0.3.6"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
url = "2"

[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

# Release profile tuned for binary size. The shipped Android .so was ~20 MB
# unstripped (5.4 MB of symbol tables) because cargo's defaults applied. The app
# logic lives in the JS webview, so the Rust shell can optimize for size with no
# meaningful runtime cost.
[profile.release]
strip = "symbols"   # drop the ~5.4 MB symbol/debug tables
lto = true          # cross-crate inlining + dead-code elimination
codegen-units = 1   # better optimization (slower build)
opt-level = "s"     # optimize for size
panic = "abort"     # no unwind tables

# Xcode 27 (Swift 6.4): SwiftPM's new build system internalizes non-public
# @_cdecl exports in release static libs, breaking the Rust-side link
# (tauri-apps/tauri#16130). swift-rs 1.0.8 re-globalizes each package's own
# exports (needs rustup's llvm-tools), but the SwiftRs runtime shim symbols
# need Brendonovich/swift-rs#80, unreleased — pinned here by SHA. Build with
# SWIFT_RS_RUNTIME_ARCHIVE=Tauri. Drop this patch when swift-rs > 1.0.8 ships.
[patch.crates-io]
swift-rs = { git = "https://github.com/alchaplinsky/swift-rs", rev = "aaf38d45ab3a4b10a5af3a3dbc64424e998fae8c" }
